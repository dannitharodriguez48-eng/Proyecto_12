<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de caracteres</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="contenedor">
        <h1>Escribe tu mensaje</h1>

        <div class="campo-mensaje">
            <textarea id="mensaje" maxlength="250" placeholder="Empieza a escribir..." aria-label="Escribe tu mensaje"></textarea>
            <p class="contador"><span id="cantidad">0</span> / 250</p>
        </div>

        <p class="ayuda">Puedes escribir hasta 250 caracteres. El contador se actualiza mientras escribes.</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
